<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Calendar — um calendário para Windows e Android que guarda as tuas notas no próprio dispositivo, com lembretes nativos que aparecem mesmo com a app fechada.">
  <title>Personal Calendar — o teu calendário, no teu dispositivo</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="nav" id="nav">
    <a class="brand" href="#inicio">
      <span class="brand-dot"></span>
      <span>Personal Calendar</span>
    </a>
    <div class="nav-links" id="nav-links">
      <a href="#inicio" data-nav="inicio"></a>
      <a href="#recursos" data-nav="recursos"></a>
      <a href="#como-funciona" data-nav="como-funciona"></a>
      <a href="#instalar" data-nav="instalar"></a>
      <a href="#atualizacoes" data-nav="atualizacoes"></a>
      <a href="#faq" data-nav="faq"></a>
    </div>
    <div class="nav-tools">
      <button class="nav-icon" id="theme-btn" type="button" title="Tema" aria-label="Mudar tema claro/escuro">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      </button>
      <button class="nav-icon" id="updates-btn" type="button" title="Atualizações" aria-label="Ver atualizações recentes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="nav-icon-badge hidden" id="updates-badge" aria-hidden="true"></span>
      </button>
      <button class="nav-lang" id="lang-btn" type="button" title="Change language">EN</button>
      <a class="btn btn-primary nav-install" href="/download" id="nav-install">Instalar</a>
      <button class="nav-burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
  </nav>

  <main>
    <!-- Início -->
    <section class="view" id="view-inicio" data-view="inicio"></section>

    <!-- Recursos -->
    <section class="view" id="view-recursos" data-view="recursos"></section>

    <!-- Como Funciona -->
    <section class="view" id="view-como-funciona" data-view="como-funciona"></section>

    <!-- Instalar -->
    <section class="view" id="view-instalar" data-view="instalar"></section>

    <!-- Atualizações -->
    <section class="view" id="view-atualizacoes" data-view="atualizacoes"></section>

    <!-- FAQ -->
    <section class="view" id="view-faq" data-view="faq"></section>
  </main>

  <footer class="footer">
    <span class="brand"><span class="brand-dot"></span> Personal Calendar</span>
    <div class="footer-links">
      <a href="#recursos" data-nav="recursos"></a>
      <a href="#como-funciona" data-nav="como-funciona"></a>
      <a href="#instalar" data-nav="instalar"></a>
      <a href="#atualizacoes" data-nav="atualizacoes"></a>
    </div>
    <span class="footer-note" id="footer-note"></span>
  </footer>

  <!-- Botão flutuante de atualizações -->
  <button class="fab" id="fab" type="button" title="Atualizações" aria-label="Ver atualizações recentes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
    <span class="fab-badge hidden" id="fab-badge" aria-hidden="true"></span>
  </button>

  <!-- Modal de atualizações -->
  <div class="modal hidden" id="updates-modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div class="modal-title" id="modal-title"></div>
        <button class="modal-close" data-close="modal" type="button" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body" id="updates-modal-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
